name: Monitor legislativo UAF

on:
  schedule:
    # Barrido incremental cada 2 horas en días hábiles (UTC).
    - cron: "0 */2 * * 1-5"
    # Barrido rápido adicional los sábados para mantener conciliación diaria.
    - cron: "17 10 * * 6"
    # Conciliación profunda los domingos.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        default: validar
        options:
          - validar           # Solo comprueba que los servicios del Congreso respondan
          - conciliacion      # Barrido profundo: úsalo en la primera corrida real
          - rapido            # Barrido incremental
          - probar_correo     # Envía un correo de prueba y no toca los datos
      reiniciar_estado:
        description: "Borrar el estado y reconstruir la cartera desde cero"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-legislativo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sincronizar con la versión más reciente de main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determinar modo
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODO="${{ inputs.modo }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 0" ]; then
            MODO="conciliacion"
          else
            MODO="rapido"
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "### Monitor legislativo UAF" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Modo:** \`$MODO\`" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Pruebas offline. Si el parser o las extensiones de pertinencia se
      # rompen, el workflow falla antes de sobrescribir datos.json.
      # ------------------------------------------------------------------
      - name: Pruebas del motor base y extensiones
        run: |
          set -o pipefail
          python test_monitor_legislativo.py | tee /tmp/pruebas_base.txt
          python test_monitor_extendido.py | tee /tmp/pruebas_ext.txt
          {
            echo ""
            echo "#### Pruebas del motor"
            echo '```'
            tail -5 /tmp/pruebas_base.txt
            tail -5 /tmp/pruebas_ext.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Comprobación de los servicios del Congreso. La capa extendida mantiene
      # las mismas fuentes y suma conciliación diaria de Cámara.
      # ------------------------------------------------------------------
      - name: Comprobar servicios del Congreso
        if: steps.cfg.outputs.modo != 'probar_correo'
        continue-on-error: true
        id: fuentes
        run: |
          set -o pipefail
          python monitor_extendido.py --validar-fuentes | tee /tmp/fuentes.json || true
          {
            echo ""
            echo "#### Servicios del Congreso"
            echo '```json'
            cat /tmp/fuentes.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ficha de prueba (boletín 15975-25)
        if: steps.cfg.outputs.modo == 'validar'
        continue-on-error: true
        run: |
          set -o pipefail
          python monitor_extendido.py --probar-boletin 15975-25 | tee /tmp/ficha.json || true
          {
            echo ""
            echo "#### Lectura y clasificación de un boletín real"
            echo '```json'
            cat /tmp/ficha.json
            echo '```'
            echo ""
            echo "Si esta ficha se ve correcta, vuelve a ejecutar el workflow en modo **conciliacion** para construir la cartera."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reiniciar estado
        if: inputs.reiniciar_estado == true
        run: rm -f .monitor_estado.json

      - name: Correo de prueba
        if: steps.cfg.outputs.modo == 'probar_correo'
        env:
          MONITOR_CORREO_ACTIVO: "true"
          MONITOR_SMTP_SERVIDOR: ${{ secrets.MONITOR_SMTP_SERVIDOR }}
          MONITOR_SMTP_PUERTO: ${{ secrets.MONITOR_SMTP_PUERTO }}
          MONITOR_SMTP_SEGURIDAD: ${{ secrets.MONITOR_SMTP_SEGURIDAD }}
          MONITOR_SMTP_USUARIO: ${{ secrets.MONITOR_SMTP_USUARIO }}
          MONITOR_SMTP_CLAVE: ${{ secrets.MONITOR_SMTP_CLAVE }}
          MONITOR_DESTINATARIOS: ${{ secrets.MONITOR_DESTINATARIOS }}
          MONITOR_NIVEL_AVISO: "1"
        run: python monitor_legislativo.py --probar-correo

      - name: Ejecutar monitor
        if: steps.cfg.outputs.modo == 'rapido' || steps.cfg.outputs.modo == 'conciliacion'
        env:
          MONITOR_MODO: ${{ steps.cfg.outputs.modo }}
          MONITOR_CORREO_ACTIVO: ${{ secrets.MONITOR_SMTP_USUARIO != '' }}
          MONITOR_SMTP_SERVIDOR: ${{ secrets.MONITOR_SMTP_SERVIDOR }}
          MONITOR_SMTP_PUERTO: ${{ secrets.MONITOR_SMTP_PUERTO }}
          MONITOR_SMTP_SEGURIDAD: ${{ secrets.MONITOR_SMTP_SEGURIDAD }}
          MONITOR_SMTP_USUARIO: ${{ secrets.MONITOR_SMTP_USUARIO }}
          MONITOR_SMTP_CLAVE: ${{ secrets.MONITOR_SMTP_CLAVE }}
          MONITOR_DESTINATARIOS: ${{ secrets.MONITOR_DESTINATARIOS }}
          # Reglas de correo SIN CAMBIOS: 1 solo la Ley 19.913.
          MONITOR_NIVEL_AVISO: "1"
          # Conciliación de Cámara: una vez por día, dos años de descubrimiento.
          MONITOR_ANNOS_CAMARA_DIARIO: "2"
          MONITOR_CAMARA_REVISION_NUEVOS_DIAS: "60"
          MONITOR_CAMARA_REVISION_CONCILIACION_DIAS: "540"
        run: python monitor_extendido.py --modo "${{ steps.cfg.outputs.modo }}"

      - name: Generar resumen ejecutivo para Centro-Monitoreo
        if: steps.cfg.outputs.modo == 'rapido' || steps.cfg.outputs.modo == 'conciliacion'
        shell: bash
        run: |
          set -o pipefail
          python generar_resumen.py --entrada datos.json --salida resumen.json 2>&1 | tee resumen.log
          test -s resumen.json
          python - <<'PY'
          import json
          from pathlib import Path
          resumen = json.loads(Path('resumen.json').read_text(encoding='utf-8'))
          assert resumen.get('tipo') == 'legislativo', resumen.get('tipo')
          assert isinstance(resumen.get('alertas'), list), 'alertas debe ser una lista'
          print('resumen.json validado para legislación:', len(resumen.get('alertas', [])), 'alertas')
          PY

      - name: Resumen de la corrida
        if: steps.cfg.outputs.modo == 'rapido' || steps.cfg.outputs.modo == 'conciliacion'
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("datos.json").read_text(encoding="utf-8"))
          a, m = d.get("auditoria", {}), d.get("metricas", {})
          print("\n#### Resultado\n")
          print(f"Generado **{d.get('generado_legible','')}** · motor `{d.get('version_motor','')}`\n")
          print("| Indicador | Valor |")
          print("|---|---|")
          for k, v in [
              ("Proyectos en cartera", m.get("total", 0)),
              ("En tramitación", m.get("vigentes", 0)),
              ("Impacto directo en la Ley 19.913", m.get("impacto_directo", 0)),
              ("Impacto estructural", m.get("impacto_estructural", 0)),
              ("Con urgencia vigente", m.get("con_urgencia", 0)),
              ("Prioridad crítica o alta", m.get("prioridad_critica", 0) + m.get("prioridad_alta", 0)),
              ("Novedades de esta corrida", a.get("novedades_corrida", 0)),
              ("Boletines consultados", a.get("boletines_consultados", 0)),
              ("Descartados por pertinencia", a.get("descartados_por_pertinencia", 0)),
              ("Consultas fallidas", a.get("consultas_fallidas", 0)),
              ("Segundos", a.get("segundos_corrida", 0)),
          ]:
              print(f"| {k} | {v} |")
          canales = a.get("canales", {})
          if canales:
              print(f"| Conciliación Cámara | {canales.get('camara_conciliacion_diaria','')} |")
              print(f"| Registros Cámara diarios | {canales.get('camara_diaria_resultados', 0)} |")
          top = sorted(d.get("proyectos", []), key=lambda p: -(p.get("prioridad") or 0))[:10]
          if top:
              print("\n#### Diez proyectos de mayor prioridad\n")
              print("| Boletín | Prioridad | Impacto | Urgencia | Título |")
              print("|---|---|---|---|---|")
              for p in top:
                  t = (p.get("titulo") or "")[:95].replace("|", "/")
                  print(f"| {p.get('boletin','')} | {p.get('banda_prioridad','')} "
                        f"| {p.get('nivel_impacto','')} | {p.get('urgencia_legible','')} | {t} |")
          PY

      - name: Publicar resultados de forma segura
        if: steps.cfg.outputs.modo == 'rapido' || steps.cfg.outputs.modo == 'conciliacion'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "monitor-legislativo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Conserva fuera del repositorio los resultados generados por esta corrida.
          SALIDA_TEMPORAL="$(mktemp -d)"
          cp datos.json "$SALIDA_TEMPORAL/datos.json"
          cp resumen.json "$SALIDA_TEMPORAL/resumen.json"

          if [ -f .monitor_estado.json ]; then
            cp .monitor_estado.json "$SALIDA_TEMPORAL/.monitor_estado.json"
            ESTADO_GENERADO="si"
          else
            ESTADO_GENERADO="no"
          fi

          # Reintenta sobre la versión más reciente de main. Así, un commit
          # realizado mientras corría el monitor no produce conflictos de rebase.
          for INTENTO in 1 2 3 4; do
            echo "Intento de publicación $INTENTO de 4"

            git fetch origin main
            git checkout -B main origin/main

            cp "$SALIDA_TEMPORAL/datos.json" datos.json
            cp "$SALIDA_TEMPORAL/resumen.json" resumen.json

            if [ "$ESTADO_GENERADO" = "si" ]; then
              cp "$SALIDA_TEMPORAL/.monitor_estado.json" .monitor_estado.json
            else
              rm -f .monitor_estado.json
            fi

            git add -f datos.json resumen.json .monitor_estado.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "La rama principal ya contiene estos resultados."
              exit 0
            fi

            git commit -m "Monitor legislativo: ${{ steps.cfg.outputs.modo }} $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Resultados publicados correctamente."
              exit 0
            fi

            echo "La rama cambió durante la publicación; se reintentará sin rebase."
            sleep $((INTENTO * 3))
          done

          echo "No fue posible publicar después de 4 intentos."
          exit 1
